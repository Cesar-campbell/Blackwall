# Blackwall (versión real): directorio + proveedor de identidad + app, todo con TLS.
# Se usa a través de scripts/bw.sh (que pasa el archivo de secretos con --env-file).
name: blackwall

x-ldap-env: &ldap-env
  LDAP_ROOT: ${LDAP_BASE}
  LDAP_ADMIN_USERNAME: admin
  LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
  LDAP_CONFIG_ADMIN_ENABLED: "yes"
  LDAP_CONFIG_ADMIN_USERNAME: admin
  LDAP_CONFIG_ADMIN_PASSWORD: ${LDAP_CONFIG_PASSWORD}

services:
  ldap:
    restart: unless-stopped
    image: bitnamilegacy/openldap:2.6.10-debian-12-r4
    environment:
      <<: *ldap-env
      LDAP_SKIP_DEFAULT_TREE: "yes"
      LDAP_ALLOW_ANON_BINDING: "no"
      LDAP_CONFIGURE_PPOLICY: "yes"
      LDAP_PPOLICY_USE_LOCKOUT: "yes"
      LDAP_PPOLICY_HASH_CLEARTEXT: "yes"
      LDAP_ENABLE_TLS: "yes"
      LDAP_REQUIRE_TLS: "yes"
      LDAP_LDAPS_PORT_NUMBER: "1636"
      LDAP_TLS_CERT_FILE: /certs/ldap.crt
      LDAP_TLS_KEY_FILE: /certs/ldap.key
      LDAP_TLS_CA_FILE: /certs/ca.crt
    volumes:
      - ${BW_HOME}/certs:/certs:ro
      - ${BW_HOME}/ldifs:/ldifs:ro
      - ldap-datos:/bitnami/openldap
    networks: [bw]
    healthcheck:
      test: ["CMD-SHELL", "LDAPTLS_REQCERT=never ldapsearch -x -H ldaps://localhost:1636 -D cn=admin,$${LDAP_ROOT} -w $${LDAP_ADMIN_PASSWORD} -b $${LDAP_ROOT} -s base dn | grep -q '^dn:'"]
      interval: 5s
      timeout: 5s
      retries: 30

  ldap-init:
    image: bitnamilegacy/openldap:2.6.10-debian-12-r4
    entrypoint: ["/bin/bash", "/init.sh"]
    environment:
      <<: *ldap-env
    volumes:
      - ${BW_HOME}/certs:/certs:ro
      - ./ldap/init.sh:/init.sh:ro
    networks: [bw]
    depends_on:
      ldap: { condition: service_healthy }
    restart: "no"

  db:
    restart: unless-stopped
    image: postgres:16-alpine
    # PostgreSQL solo acepta conexiones de red cifradas (TLS) con certificado de la CA del laboratorio
    command: ["sh", "-c", "cp /certs/db.key /var/lib/postgresql/db.key && chmod 600 /var/lib/postgresql/db.key && chown postgres:postgres /var/lib/postgresql/db.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/db.crt -c ssl_key_file=/var/lib/postgresql/db.key -c ssl_ca_file=/certs/ca.crt -c hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - kc-db:/var/lib/postgresql/data
      - ${BW_HOME}/certs:/certs:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks: [bw]

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak?sslmode=verify-full&sslrootcert=/certs/ca.crt
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://acceso.localhost:8443
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: "8443"
      KC_HTTPS_CERTIFICATE_FILE: /certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/keycloak.key
      KC_TRUSTSTORE_PATHS: /certs/ca.crt
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ${BW_HOME}/certs:/certs:ro
      - ./keycloak/temas:/opt/keycloak/themes:ro
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      bw:
        aliases: [acceso.localhost]
    depends_on:
      db: { condition: service_started }
      ldap-init: { condition: service_completed_successfully }

  app:
    restart: unless-stopped
    build: ./app
    environment:
      APP_URL: https://app.localhost:8444
      OIDC_ISSUER: https://acceso.localhost:8443/realms/proyecto-accesos
      OIDC_CLIENT_ID: cli-blackwall-dev
      OIDC_CLIENT_SECRET: ${CLIENT_SECRET}
      SYNC_CLIENT_ID: cli-blackwall-sync-dev
      SYNC_CLIENT_SECRET: ${SYNC_CLIENT_SECRET}
      KC_URL: https://acceso.localhost:8443
      RESOLVE_MAP: acceso.localhost=keycloak
      KC_REALM: proyecto-accesos
      LDAP_URL: ldaps://ldap:1636
      LDAP_BASE: ${LDAP_BASE}
      LDAP_BIND_DN: uid=svc-blackwall-sync,ou=servicio,${LDAP_BASE}
      LDAP_BIND_PASSWORD: ${SVC_LDAP_PASSWORD}
      LDAPTLS_CACERT: /certs/ca.crt
      CA_BUNDLE: /certs/ca.crt
    volumes:
      - ${BW_HOME}/certs:/certs:ro
      - app-datos:/var/www/datos
    ports:
      - "127.0.0.1:8444:443"
    networks:
      bw:
        aliases: [app.localhost]
    depends_on:
      - keycloak
      - ldap

networks:
  bw:

volumes:
  ldap-datos:
  kc-db:
  app-datos:
