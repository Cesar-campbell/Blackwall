# Endurecimiento de Apache (se aplicó tras el primer escaneo ZAP; ver README, "Hallazgos de ZAP")
ServerName app.localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:443>
    ServerName app.localhost
    DocumentRoot /var/www/app/public

    SSLEngine on
    SSLCertificateFile    /certs/app.crt
    SSLCertificateKeyFile /certs/app.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # Cabeceras de seguridad en todas las respuestas (también en errores)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Cache-Control "no-store, no-cache, must-revalidate, private"
    Header always set Pragma "no-cache"
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'"

    <Directory /var/www/app/public>
        AllowOverride None
        Require all granted
        Options -Indexes -MultiViews
        RewriteEngine On
        # Apache no pasa la cabecera Authorization a PHP por defecto: se reenvía a una variable de entorno
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        # Si no es un archivo estático existente, todo pasa por el controlador frontal
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
